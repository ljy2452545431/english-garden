plugins { id 'com.android.application' }
android {
    namespace 'cn.englishgarden.app'
    compileSdk 35
    buildToolsVersion '35.0.1'
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'cn.englishgarden.app'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0' }
    signingConfigs {
        release {
            storeFile file(System.getenv('GARDEN_KEYSTORE') ?: 'missing.jks')
            storePassword System.getenv('GARDEN_STORE_PASSWORD')
            keyAlias 'english-garden'
            keyPassword System.getenv('GARDEN_STORE_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
